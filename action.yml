name: "Maximize GitHub Runner Space"
description: "Safely reclaim disk space on standard GitHub-hosted Linux, macOS, and Windows runners"
branding:
  icon: "crop"
  color: "blue"

inputs:
  cleanup-profile:
    description: "Cleanup mode: custom (use remove-* flags) or max (enable applicable components except skip-components)"
    required: false
    default: "max"
  skip-components:
    description: "Comma-separated components to preserve when cleanup-profile=max"
    required: false
    default: ""
  swapfile-size:
    description: "Optional privileged-Linux swap size: 0, 1.5GiB, 512MiB, or a plain GiB value like 2; omitted leaves swap unchanged"
    required: false
    default: ""

  # Toolchains and SDKs
  remove-dotnet:
    description: "Removes installed .NET SDKs, runtimes, and user tools"
    required: false
    default: "false"
  remove-android:
    description: "Removes the Android SDK and Android user caches"
    required: false
    default: "false"
  remove-haskell:
    description: "Removes GHCup, GHC, Cabal, and Stack artifacts where installed"
    required: false
    default: "false"
  remove-codeql:
    description: "Removes CodeQL Action bundles from the hosted toolcache"
    required: false
    default: "false"
  remove-cached-tools:
    description: "Removes and recreates the hosted setup-action toolcache"
    required: false
    default: "false"
  remove-swift:
    description: "Removes standalone Swift toolchain files on Linux; does not remove Xcode"
    required: false
    default: "false"
  remove-julia:
    description: "Removes Julia binaries, libraries, and cached versions where installed"
    required: false
    default: "false"
  remove-java:
    description: "Removes installed JDKs and Java toolcache entries"
    required: false
    default: "false"
  remove-powershell:
    description: "Removes PowerShell where it is safely separable from the runner"
    required: false
    default: "false"
  remove-miniconda:
    description: "Removes Miniconda and its user caches where installed"
    required: false
    default: "false"
  remove-homebrew:
    description: "Runs conservative Linuxbrew cleanup or removes definition-listed macOS packages without deleting either prefix"
    required: false
    default: "false"
  remove-vcpkg:
    description: "Removes the runner-image vcpkg installation and user caches"
    required: false
    default: "false"

  # Hosted toolcache subsets
  remove-cached-go:
    description: "Removes Go toolcache entries"
    required: false
    default: "false"
  remove-cached-node:
    description: "Removes Node.js toolcache entries"
    required: false
    default: "false"
  remove-cached-python:
    description: "Removes Python toolcache entries"
    required: false
    default: "false"
  remove-cached-pypy:
    description: "Removes PyPy toolcache entries"
    required: false
    default: "false"
  remove-cached-ruby:
    description: "Removes Ruby toolcache entries"
    required: false
    default: "false"

  # Browsers and drivers
  remove-browsers:
    description: "Removes supported major browsers, webdrivers, and Selenium artifacts"
    required: false
    default: "false"
  remove-chrome:
    description: "Removes Google Chrome where installed"
    required: false
    default: "false"
  remove-chromium:
    description: "Removes Chromium where installed"
    required: false
    default: "false"
  remove-edge:
    description: "Removes Microsoft Edge where installed"
    required: false
    default: "false"
  remove-firefox:
    description: "Removes Firefox where installed"
    required: false
    default: "false"
  remove-webdrivers:
    description: "Removes ChromeDriver, GeckoDriver, and Edge WebDriver artifacts"
    required: false
    default: "false"
  remove-selenium:
    description: "Removes Selenium server artifacts"
    required: false
    default: "false"

  # Cloud and developer CLIs
  remove-aws-cli:
    description: "Removes AWS CLI v2 and the Session Manager plugin"
    required: false
    default: "false"
  remove-aws-sam-cli:
    description: "Removes AWS SAM CLI"
    required: false
    default: "false"
  remove-azure-cli:
    description: "Removes Azure CLI"
    required: false
    default: "false"
  remove-gh-cli:
    description: "Removes GitHub CLI"
    required: false
    default: "false"
  remove-gcloud-cli:
    description: "Removes Google Cloud CLI/SDK where installed"
    required: false
    default: "false"
  remove-azcopy:
    description: "Removes AzCopy"
    required: false
    default: "false"
  remove-kubectl:
    description: "Removes kubectl"
    required: false
    default: "false"
  remove-helm:
    description: "Removes Helm"
    required: false
    default: "false"
  remove-kind:
    description: "Removes kind"
    required: false
    default: "false"
  remove-minikube:
    description: "Removes Minikube where installed"
    required: false
    default: "false"
  remove-kustomize:
    description: "Removes Kustomize where installed"
    required: false
    default: "false"

  # Containers, build tools, and languages
  remove-docker-engine:
    description: "Stops and removes Docker Engine packages, helpers, and data where installed"
    required: false
    default: "false"
  remove-buildah:
    description: "Removes Buildah where installed"
    required: false
    default: "false"
  remove-podman:
    description: "Removes Podman and its runner storage where installed"
    required: false
    default: "false"
  remove-maven:
    description: "Removes Apache Maven"
    required: false
    default: "false"
  remove-gradle:
    description: "Removes Gradle"
    required: false
    default: "false"
  remove-ant:
    description: "Removes Apache Ant"
    required: false
    default: "false"
  remove-php:
    description: "Removes PHP, Composer, and PHPUnit where installed"
    required: false
    default: "false"
  remove-rust:
    description: "Removes Rustup, Cargo, and Rust toolchains"
    required: false
    default: "false"

  # Services and databases
  remove-postgresql:
    description: "Removes PostgreSQL packages and runner data where installed"
    required: false
    default: "false"
  remove-mysql:
    description: "Removes MySQL/MariaDB packages and runner data where installed"
    required: false
    default: "false"
  remove-apache:
    description: "Removes Apache HTTP Server where installed"
    required: false
    default: "false"
  remove-nginx:
    description: "Removes Nginx where installed"
    required: false
    default: "false"

  # Broad and platform-specific cleanup
  remove-docker-images:
    description: "Removes unused Docker containers, images, build cache, networks, and volumes"
    required: false
    default: "false"
  remove-large-packages:
    description: "Purges the legacy set of additional large apt packages on Linux"
    required: false
    default: "false"
  remove-xcode:
    description: "Removes unselected versioned Xcode applications while preserving the selected Xcode"
    required: false
    default: "false"
  remove-visual-studio:
    description: "Removes eligible runner-image Visual Studio instances through the registered installer"
    required: false
    default: "false"
  remove-windows-sdk:
    description: "Removes definition-listed Windows SDK/WDK components through the Visual Studio installer"
    required: false
    default: "false"

outputs:
  available-bytes-before:
    description: "Available bytes on the runner system volume before cleanup"
  available-bytes-after:
    description: "Available bytes on the runner system volume after cleanup"
  reclaimed-bytes:
    description: "Net additional available bytes after cleanup"
  failed-operations:
    description: "Number of best-effort cleanup operations that reported failure"
  platform:
    description: "Detected platform: linux, macos, or windows"
  architecture:
    description: "Detected architecture: x64 or arm64"

runs:
  using: "node24"
  main: "dist/index.js"
