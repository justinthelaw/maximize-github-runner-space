minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

# CI installs every entry point from hash-locked pip requirements, the npm
# lockfile, or a checksum-verified actionlint release before running hooks.
repos:
  - repo: local
    hooks:
      - id: check-added-large-files
        name: Large Files Check
        entry: check-added-large-files
        language: system
        args: ["--maxkb=1024", "--enforce-all"]
        stages: [pre-push]

      - id: detect-private-key
        name: Private Key Check
        entry: detect-private-key
        language: system
        types: [text]
        stages: [pre-push]

      - id: check-merge-conflict
        name: Merge Conflict Resolution Check
        entry: check-merge-conflict
        language: system
        types: [text]
        stages: [pre-commit, pre-push]

      - id: end-of-file-fixer
        name: Newline EOF Checker
        entry: end-of-file-fixer
        language: system
        types: [text]
        exclude: ^CHANGELOG\.md$
        stages: [pre-commit, pre-push]

      - id: trailing-whitespace
        name: Whitespace Cleaning Check
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        args: [--markdown-linebreak-ext=md]
        exclude: ^CHANGELOG\.md$
        stages: [pre-commit, pre-push]

      - id: fix-smartquotes
        name: Fix Quotes
        entry: fix-smartquotes
        language: system
        types: [text]
        exclude: ^CHANGELOG\.md$
        stages: [pre-commit, pre-push]

      - id: markdownlint-cli2
        name: Markdown Lint
        entry: node_modules/.bin/markdownlint-cli2
        language: system
        types: [markdown]
        args: ["--fix", "--config=.markdownlint-cli2.jsonc"]
        exclude: ^CHANGELOG\.md$
        stages: [pre-commit, pre-push]

      - id: yamllint
        name: YAML Lint
        entry: yamllint
        language: system
        types: [file, yaml]
        args: ["--strict", "-c=.yamllint"]
        stages: [pre-commit, pre-push]

      - id: actionlint
        name: GitHub Workflow Lint
        entry: node_modules/.bin/actionlint
        language: system
        types: [yaml]
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [pre-commit, pre-push]
