version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    ignore:
      # Keep compile-time APIs compatible with the Node.js 22 development floor.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    schedule:
      interval: weekly
    groups:
      javascript-action:
        patterns:
          - "*"
