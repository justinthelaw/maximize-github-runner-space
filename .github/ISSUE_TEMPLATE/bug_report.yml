name: Bug Report
description: Report a reproducible defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Include exact runner and workflow details to make triage fast.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-sentence description of the problem
      placeholder: Cleanup failed for...
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Workflow Snippet
      description: Include the step that runs this action and redact any secrets or private values
      render: yaml
    validations:
      required: true

  - type: input
    id: runner
    attributes:
      label: Runner Image
      description: Include the exact label and architecture, for example ubuntu-24.04-arm, windows-latest, or macos-15-intel
      placeholder: ubuntu-latest
    validations:
      required: true

  - type: textarea
    id: image
    attributes:
      label: Runner Image Block
      description: Copy the complete Runner Image block from the Set up job log, including ImageOS, ImageVersion, and Included Software links; redact private values
      render: text
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Exact steps to reproduce the issue
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: disk
    attributes:
      label: Disk Usage Before and After
      description: Include available-bytes-before, available-bytes-after, reclaimed-bytes, and failed-operations when emitted; otherwise state that the action failed before outputs were emitted

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include the relevant run output after redacting tokens, credentials, and private paths
    validations:
      required: true
