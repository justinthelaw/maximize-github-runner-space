name: Test

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the minimum supported Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.0.0"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and unit tests
        run: npm test

      - name: Exercise same-device bind-mount deletion guard
        shell: bash
        run: |
          set -euo pipefail
          test_name='Linux hosted smoke rejects a same-device bind mount in every Unix removal helper'
          node_runtime="$(command -v node)"
          set +e
          output="$(sudo env RUN_NATIVE_BIND_MOUNT_TEST=1 "$node_runtime" \
            --test \
            --test-reporter=tap \
            --test-name-pattern "^${test_name}$" \
            build/test/safety.test.js 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          (( status == 0 ))
          grep -Eq "^ok [0-9]+ - ${test_name}$" <<<"$output"
          grep -Fx '# pass 1' <<<"$output"
          grep -Fx '# fail 0' <<<"$output"

      - name: Formatting
        run: npm run format:check

      - name: Verify committed action bundle
        run: npm run check-dist

  ubuntu-x64:
    name: Ubuntu x64 compatibility
    needs: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep the configured swap active across every compatibility assertion,
      # including historical no-input max. Remove it only after preservation is
      # proven so this one runner covers the full transactional lifecycle.
      - name: Prepare untrusted swap utility shims
        shell: bash
        run: |
          set -euo pipefail
          shim_root="${RUNNER_TEMP}/untrusted-swap-bin"
          /usr/bin/install -d "$shim_root"
          for utility in swapon swapoff grep df mktemp fallocate dd truncate chmod chown mkswap mv rm tee test; do
            /usr/bin/printf '%s\n' '#!/bin/sh' 'exit 97' >"${shim_root}/${utility}"
            /usr/bin/chmod +x "${shim_root}/${utility}"
          done

      - name: Resize swapfile with the historical fractional syntax
        id: swap-resize
        uses: ./
        # Prove workflow-controlled image variables cannot select or reject the
        # image; runtime authorization comes from the fixed image-data record.
        env:
          ImageOS: rhel9
          ImageVersion: not-a-version
          PATH: ${{ runner.temp }}/untrusted-swap-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          cleanup-profile: custom
          swapfile-size: 1.5GiB

      - name: Verify configured swapfile
        shell: bash
        env:
          FAILED_OPERATIONS: ${{ steps.swap-resize.outputs.failed-operations }}
        run: |
          set -euo pipefail
          [[ "$FAILED_OPERATIONS" == 0 ]]
          test "$(stat -c %s /mnt/swapfile)" -eq 1610612736
          swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fx /mnt/swapfile
          grep -Eq '^[[:blank:]]*/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab

      - name: Reject an unsafe oversized replacement
        id: oversized
        continue-on-error: true
        uses: ./
        with:
          cleanup-profile: custom
          swapfile-size: 100TiB

      - name: Verify oversized request rolled back
        shell: bash
        env:
          OUTCOME: ${{ steps.oversized.outcome }}
        run: |
          set -euo pipefail
          [[ "$OUTCOME" == failure ]]
          test "$(stat -c %s /mnt/swapfile)" -eq 1610612736
          swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fx /mnt/swapfile
          grep -Eq '^[[:blank:]]*/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab

      - name: Assert protected and removable fixtures exist
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is not set}"
          test -d /usr/share/dotnet
          test -d "${RUNNER_TOOL_CACHE}/node"
          test -d "${RUNNER_TOOL_CACHE}/Python"
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          command -v azcopy >/dev/null
          command -v firefox >/dev/null
          command -v google-chrome >/dev/null

      - name: Preserve exact custom-toggle semantics
        uses: ./
        with:
          cleanup-profile: custom
          remove-azcopy: "TRUE"

      - name: Verify non-lowercase toggle stayed disabled
        shell: bash
        run: command -v azcopy >/dev/null

      - name: Reject an invalid profile before mutation
        id: invalid-profile
        continue-on-error: true
        uses: ./
        with:
          cleanup-profile: invalid-profile

      - name: Reject an invalid skip before mutation
        id: invalid-skip
        continue-on-error: true
        uses: ./
        with:
          cleanup-profile: max
          skip-components: dotnet,not-a-component

      - name: Verify validation failures and fixtures
        shell: bash
        env:
          PROFILE_OUTCOME: ${{ steps.invalid-profile.outcome }}
          SKIP_OUTCOME: ${{ steps.invalid-skip.outcome }}
        run: |
          set -euo pipefail
          [[ "$PROFILE_OUTCOME" == failure ]]
          [[ "$SKIP_OUTCOME" == failure ]]
          test -d /usr/share/dotnet
          test -d "${RUNNER_TOOL_CACHE}/node"
          test -d "${RUNNER_TOOL_CACHE}/Python"
          command -v firefox >/dev/null
          command -v google-chrome >/dev/null
          test "$(stat -c %s /mnt/swapfile)" -eq 1610612736
          swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fx /mnt/swapfile
          grep -Eq '^[[:blank:]]*/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab

      - name: Prepare disposable Docker prune fixtures
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          fixture_root="${RUNNER_TEMP}/docker-prune-fixture"
          image="maximize-runner-space-prune-fixture:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="maximize-runner-space-prune-fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="maximize-runner-space-prune-fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          named_volume="maximize-runner-space-prune-preserved-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$fixture_root"
          printf '%s\n' '#!/bin/sh' 'exit 0' >"${fixture_root}/fixture"
          chmod +x "${fixture_root}/fixture"
          tar -C "$fixture_root" -c . | docker import - "$image" >/dev/null
          docker create \
            --name "$container" \
            --mount type=volume,destination=/fixture-volume \
            "$image" /fixture >/dev/null
          anonymous_volume="$(docker inspect --format '{{(index .Mounts 0).Name}}' "$container")"
          test -n "$anonymous_volume"
          docker network create "$network" >/dev/null
          docker volume create "$named_volume" >/dev/null
          {
            echo "DOCKER_PRUNE_FIXTURE_IMAGE=$image"
            echo "DOCKER_PRUNE_FIXTURE_CONTAINER=$container"
            echo "DOCKER_PRUNE_FIXTURE_NETWORK=$network"
            echo "DOCKER_PRUNE_ANONYMOUS_VOLUME=$anonymous_volume"
            echo "DOCKER_PRUNE_NAMED_VOLUME=$named_volume"
          } >>"$GITHUB_ENV"

      - name: Exercise native Docker pruning
        id: docker-prune
        uses: ./
        with:
          cleanup-profile: custom
          remove-docker-images: "true"

      - name: Verify Docker prune scope and isolation cleanup
        shell: bash
        env:
          FAILED_OPERATIONS: ${{ steps.docker-prune.outputs.failed-operations }}
        run: |
          set -euo pipefail
          [[ "$FAILED_OPERATIONS" == 0 ]]
          docker info >/dev/null
          for removed in \
            "container:$DOCKER_PRUNE_FIXTURE_CONTAINER" \
            "image:$DOCKER_PRUNE_FIXTURE_IMAGE" \
            "network:$DOCKER_PRUNE_FIXTURE_NETWORK" \
            "volume:$DOCKER_PRUNE_ANONYMOUS_VOLUME"; do
            kind="${removed%%:*}"
            target="${removed#*:}"
            if docker "$kind" inspect "$target" >/dev/null 2>&1; then
              echo "Docker prune left $kind fixture '$target'." >&2
              exit 1
            fi
          done
          docker volume inspect "$DOCKER_PRUNE_NAMED_VOLUME" >/dev/null
          docker volume rm "$DOCKER_PRUNE_NAMED_VOLUME" >/dev/null
          leftover_config="$(find /tmp -maxdepth 1 -name 'maximize-github-runner-space-docker-config-*' -print -quit)"
          if [[ -n "$leftover_config" ]]; then
            echo "Docker cleanup left isolated configuration '$leftover_config'." >&2
            exit 1
          fi

      - name: Exercise normalized max skips and toolcache precedence
        id: max-skip
        uses: ./
        with:
          cleanup-profile: " MaX "
          skip-components: " DotNet , Cached-Node , Firefox "

      - name: Verify skipped children survived and sibling cleanup ran
        shell: bash
        env:
          FAILED_OPERATIONS: ${{ steps.max-skip.outputs.failed-operations }}
          PLATFORM: ${{ steps.max-skip.outputs.platform }}
          ARCHITECTURE: ${{ steps.max-skip.outputs.architecture }}
        run: |
          set -euo pipefail
          [[ "$FAILED_OPERATIONS" == 0 ]]
          [[ "$PLATFORM" == linux ]]
          [[ "$ARCHITECTURE" == x64 ]]
          test -d /usr/share/dotnet
          test -d "${RUNNER_TOOL_CACHE}/node"
          test ! -e "${RUNNER_TOOL_CACHE}/Python"
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          command -v firefox >/dev/null
          if command -v google-chrome >/dev/null 2>&1; then
            echo "google-chrome should have been removed" >&2
            exit 1
          fi
          test "$(stat -c %s /mnt/swapfile)" -eq 1610612736
          swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fx /mnt/swapfile
          grep -Eq '^[[:blank:]]*/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab

      - name: Record dependency-free OS runtimes before no-input max
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="${RUNNER_TEMP}/max-runtime-smoke"
          mkdir -p "$runtime_root"
          test -x /bin/bash
          test -x /bin/sh
          test -x /usr/bin/python3
          /usr/bin/python3 -I -S -c 'import json; assert json.loads(json.dumps({"status": "ok"}))["status"] == "ok"'
          perl_runtime=""
          if [[ -x /usr/bin/perl ]]; then
            perl_runtime=/usr/bin/perl
          fi
          {
            echo "MAX_RUNTIME_ROOT=$runtime_root"
            echo "MAX_BASH_RUNTIME=/bin/bash"
            echo "MAX_SH_RUNTIME=/bin/sh"
            echo "MAX_PYTHON_RUNTIME=/usr/bin/python3"
            echo "MAX_PERL_RUNTIME=$perl_runtime"
          } >>"$GITHUB_ENV"

      - name: Run historical no-input max profile
        id: cleanup
        uses: ./

      - name: Exercise dependency-free OS runtimes after no-input max
        shell: bash
        run: |
          set -euo pipefail
          "$MAX_BASH_RUNTIME" -c 'printf "%s\n" bash-max' >"${MAX_RUNTIME_ROOT}/bash.txt"
          "$MAX_SH_RUNTIME" -c 'printf "%s\n" sh-max' >"${MAX_RUNTIME_ROOT}/sh.txt"
          grep -Fx bash-max "${MAX_RUNTIME_ROOT}/bash.txt"
          grep -Fx sh-max "${MAX_RUNTIME_ROOT}/sh.txt"
          if ! "$MAX_PYTHON_RUNTIME" -I -S -c 'import json; value = {"profile": "max", "runtime": "python"}; raise SystemExit(0 if json.loads(json.dumps(value)) == value else 1)'; then
            echo "Python max-profile JSON round trip failed." >&2
            exit 1
          fi
          if [[ -n "$MAX_PERL_RUNTIME" ]]; then
            "$MAX_PERL_RUNTIME" -e 'print "perl-max\n"' >"${MAX_RUNTIME_ROOT}/perl.txt"
            grep -Fx perl-max "${MAX_RUNTIME_ROOT}/perl.txt"
          fi

      - name: Verify compatibility contract
        shell: bash
        env:
          BEFORE: ${{ steps.cleanup.outputs.available-bytes-before }}
          AFTER: ${{ steps.cleanup.outputs.available-bytes-after }}
          RECLAIMED: ${{ steps.cleanup.outputs.reclaimed-bytes }}
          FAILED_OPERATIONS: ${{ steps.cleanup.outputs.failed-operations }}
          PLATFORM: ${{ steps.cleanup.outputs.platform }}
          ARCHITECTURE: ${{ steps.cleanup.outputs.architecture }}
        run: |
          set -euo pipefail
          [[ "$BEFORE" =~ ^[0-9]+$ ]]
          [[ "$AFTER" =~ ^[0-9]+$ ]]
          [[ "$RECLAIMED" =~ ^[0-9]+$ ]]
          (( RECLAIMED > 0 ))
          [[ "$FAILED_OPERATIONS" == 0 ]]
          [[ "$PLATFORM" == linux ]]
          [[ "$ARCHITECTURE" == x64 ]]
          test "$(stat -c %s /mnt/swapfile)" -eq 1610612736
          swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fx /mnt/swapfile
          grep -Eq '^[[:blank:]]*/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab
          test ! -e /usr/share/dotnet
          test -x /home/linuxbrew/.linuxbrew/bin/brew

      - name: Remove the managed swapfile
        uses: ./
        with:
          cleanup-profile: custom
          swapfile-size: "0"

      - name: Verify swapfile removal
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /mnt/swapfile
          if swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fxq /mnt/swapfile; then
            echo "/mnt/swapfile is still active" >&2
            exit 1
          fi
          if grep -Eq '^[[:blank:]]*/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab; then
            echo "/mnt/swapfile still has an fstab entry" >&2
            exit 1
          fi

  platform-smoke:
    name: ${{ matrix.name }}
    needs: static-validation
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Ubuntu arm64
            runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
          - name: Ubuntu slim
            runner: ubuntu-slim
            platform: linux
            architecture: x64
          - name: Windows x64
            runner: windows-latest
            platform: windows
            architecture: x64
          - name: Windows arm64
            runner: windows-11-arm
            platform: windows
            architecture: arm64
          - name: macOS arm64
            runner: macos-latest
            platform: macos
            architecture: arm64
          - name: macOS Intel
            runner: macos-15-intel
            platform: macos
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the minimum supported Node.js version for native removal tests
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.0.0"
          package-manager-cache: false

      # cmd resolves setup-node's npm.cmd before the runner's stale global
      # PowerShell npm.ps1 shim on both Windows architectures.
      - name: Install locked test dependencies on Windows
        if: matrix.platform == 'windows'
        shell: cmd
        run: call npm.cmd ci --ignore-scripts

      - name: Compile native removal tests on Windows
        if: matrix.platform == 'windows'
        shell: cmd
        run: call .\node_modules\.bin\tsc.cmd --project tsconfig.json

      - name: Install and compile native removal tests on macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          ./node_modules/.bin/tsc --project tsconfig.json

      - name: Exercise native locked-handle deletion on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $architecture = node -p "process.arch"
          if ($architecture -ne $env:EXPECTED_ARCHITECTURE) {
            throw "Expected Node architecture $env:EXPECTED_ARCHITECTURE, got $architecture."
          }
          $testName = 'Windows hosted smoke removes a target through native locked handles'
          $testLines = & node --test --test-timeout=180000 --test-reporter=tap --test-name-pattern "^$([regex]::Escape($testName))$" build/test/safety.test.js 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput = $testLines -join [Environment]::NewLine
          Write-Output $testOutput
          if ($testExitCode -ne 0) {
            throw "Native locked-handle test exited $testExitCode."
          }
          $executedPattern = "(?m)^ok \d+ - $([regex]::Escape($testName))\r?$"
          $executedTests = [regex]::Matches($testOutput, $executedPattern)
          if ($executedTests.Count -ne 1) {
            throw "Expected exactly one native locked-handle test, found $($executedTests.Count)."
          }
          if ($testOutput -notmatch '(?m)^# pass 1\r?$') {
            throw 'Native locked-handle test did not report exactly one pass.'
          }
          if ($testOutput -notmatch '(?m)^# fail 0\r?$') {
            throw 'Native locked-handle test reported a failure.'
          }

      - name: Exercise native dir-fd deletion on macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          test_name='macOS native privileged removal deletes a root-owned tree without following links'
          set +e
          output="$(node \
            --test \
            --test-reporter=tap \
            --test-name-pattern "^${test_name}$" \
            build/test/safety.test.js 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          (( status == 0 ))
          grep -Eq "^ok [0-9]+ - ${test_name}$" <<<"$output"
          grep -Fx '# pass 1' <<<"$output"
          grep -Fx '# fail 0' <<<"$output"

      - name: Assert Windows PostgreSQL fixture and service exist
        if: matrix.platform == 'windows' && matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $services = @(Get-Service -Name 'postgresql-*' -ErrorAction SilentlyContinue)
          if ($services.Count -eq 0) {
            throw 'Expected the Windows x64 runner image to contain a PostgreSQL service.'
          }
          if ($services.Name | Where-Object { $_ -notmatch '^postgresql-x64-\d+(?:\.\d+)*$' }) {
            throw 'PostgreSQL service name is outside the adapter allowlist.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PGROOT) -or -not (Test-Path -LiteralPath $env:PGROOT)) {
            throw 'Expected the Windows x64 runner image to contain PGROOT.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PGDATA) -or -not (Test-Path -LiteralPath $env:PGDATA)) {
            throw 'Expected the Windows x64 runner image to contain PGDATA.'
          }
          $dataRoot = Split-Path -Parent $env:PGDATA
          if ($dataRoot -notmatch '^C:\\PostgreSQL\\\d+(?:\.\d+)*$') {
            throw "Unexpected PostgreSQL data root: $dataRoot"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "POSTGRES_DATA_ROOT=$dataRoot" -Encoding utf8

      - name: Exercise Windows PostgreSQL cleanup
        if: matrix.platform == 'windows' && matrix.architecture == 'x64'
        id: postgresql-cleanup
        uses: ./
        with:
          cleanup-profile: custom
          remove-postgresql: "true"

      - name: Verify Windows PostgreSQL cleanup
        if: matrix.platform == 'windows' && matrix.architecture == 'x64'
        shell: pwsh
        env:
          FAILED_OPERATIONS: ${{ steps.postgresql-cleanup.outputs.failed-operations }}
        run: |
          if ($env:FAILED_OPERATIONS -ne '0') {
            throw 'A PostgreSQL cleanup operation failed.'
          }
          $remainingServices = @(
            Get-Service -Name 'postgresql-*' -ErrorAction SilentlyContinue
          )
          if ($remainingServices.Count -ne 0) {
            throw "PostgreSQL service registrations remain: $($remainingServices.Name -join ', ')"
          }
          if (Test-Path -LiteralPath $env:POSTGRES_DATA_ROOT) {
            throw "PostgreSQL data root still exists: $env:POSTGRES_DATA_ROOT"
          }
          $remainingDataRoots = @(
            Get-ChildItem -LiteralPath 'C:\PostgreSQL' -Directory -ErrorAction SilentlyContinue |
              Where-Object Name -Match '^\d+(?:\.\d+)*$'
          )
          if ($remainingDataRoots.Count -ne 0) {
            throw "Versioned PostgreSQL data roots remain: $($remainingDataRoots.FullName -join ', ')"
          }

      - name: Exercise the native adapter
        uses: ./.github/actions/platform-smoke
        with:
          expected-platform: ${{ matrix.platform }}
          expected-architecture: ${{ matrix.architecture }}
          remove-azcopy: ${{ matrix.runner != 'ubuntu-slim' }}
