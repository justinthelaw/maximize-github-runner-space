name: Test

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the minimum supported Node.js version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and unit tests
        run: npm test

      - name: Formatting
        run: npm run format:check

      - name: Verify committed action bundle
        run: npm run check-dist

  ubuntu-x64:
    name: Ubuntu x64 compatibility
    needs: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep the configured swap active across every compatibility assertion,
      # including historical no-input max. Remove it only after preservation is
      # proven so this one runner covers the full transactional lifecycle.
      - name: Resize swapfile with the historical fractional syntax
        uses: ./
        # Prove workflow-controlled image variables cannot select or reject the
        # image; runtime authorization comes from the fixed image-data record.
        env:
          ImageOS: rhel9
          ImageVersion: not-a-version
        with:
          cleanup-profile: custom
          swapfile-size: 1.5GiB

      - name: Verify configured swapfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c %s /mnt/swapfile)" -eq 1610612736
          swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fx /mnt/swapfile
          grep -Eq '^/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab

      - name: Reject an unsafe oversized replacement
        id: oversized
        continue-on-error: true
        uses: ./
        with:
          cleanup-profile: custom
          swapfile-size: 100TiB

      - name: Verify oversized request rolled back
        shell: bash
        env:
          OUTCOME: ${{ steps.oversized.outcome }}
        run: |
          set -euo pipefail
          [[ "$OUTCOME" == failure ]]
          test "$(stat -c %s /mnt/swapfile)" -eq 1610612736
          swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fx /mnt/swapfile
          grep -Eq '^/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab

      - name: Assert protected and removable fixtures exist
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is not set}"
          test -d /usr/share/dotnet
          test -d "${RUNNER_TOOL_CACHE}/node"
          test -d "${RUNNER_TOOL_CACHE}/Python"
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          command -v azcopy >/dev/null
          command -v firefox >/dev/null
          command -v google-chrome >/dev/null

      - name: Preserve exact custom-toggle semantics
        uses: ./
        with:
          cleanup-profile: custom
          remove-azcopy: "TRUE"

      - name: Verify non-lowercase toggle stayed disabled
        shell: bash
        run: command -v azcopy >/dev/null

      - name: Reject an invalid profile before mutation
        id: invalid-profile
        continue-on-error: true
        uses: ./
        with:
          cleanup-profile: invalid-profile

      - name: Reject an invalid skip before mutation
        id: invalid-skip
        continue-on-error: true
        uses: ./
        with:
          cleanup-profile: max
          skip-components: dotnet,not-a-component

      - name: Verify validation failures and fixtures
        shell: bash
        env:
          PROFILE_OUTCOME: ${{ steps.invalid-profile.outcome }}
          SKIP_OUTCOME: ${{ steps.invalid-skip.outcome }}
        run: |
          set -euo pipefail
          [[ "$PROFILE_OUTCOME" == failure ]]
          [[ "$SKIP_OUTCOME" == failure ]]
          test -d /usr/share/dotnet
          test -d "${RUNNER_TOOL_CACHE}/node"
          test -d "${RUNNER_TOOL_CACHE}/Python"
          command -v firefox >/dev/null
          command -v google-chrome >/dev/null
          test "$(stat -c %s /mnt/swapfile)" -eq 1610612736
          swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fx /mnt/swapfile
          grep -Eq '^/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab

      - name: Exercise normalized max skips and toolcache precedence
        id: max-skip
        uses: ./
        with:
          cleanup-profile: " MaX "
          skip-components: " DotNet , Cached-Node , Firefox "

      - name: Verify skipped children survived and sibling cleanup ran
        shell: bash
        env:
          PLATFORM: ${{ steps.max-skip.outputs.platform }}
          ARCHITECTURE: ${{ steps.max-skip.outputs.architecture }}
        run: |
          set -euo pipefail
          [[ "$PLATFORM" == linux ]]
          [[ "$ARCHITECTURE" == x64 ]]
          test -d /usr/share/dotnet
          test -d "${RUNNER_TOOL_CACHE}/node"
          test ! -e "${RUNNER_TOOL_CACHE}/Python"
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          command -v firefox >/dev/null
          if command -v google-chrome >/dev/null 2>&1; then
            echo "google-chrome should have been removed" >&2
            exit 1
          fi
          test "$(stat -c %s /mnt/swapfile)" -eq 1610612736
          swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fx /mnt/swapfile
          grep -Eq '^/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab

      - name: Run historical no-input max profile
        id: cleanup
        uses: ./

      - name: Verify compatibility contract
        shell: bash
        env:
          BEFORE: ${{ steps.cleanup.outputs.available-bytes-before }}
          AFTER: ${{ steps.cleanup.outputs.available-bytes-after }}
          RECLAIMED: ${{ steps.cleanup.outputs.reclaimed-bytes }}
          PLATFORM: ${{ steps.cleanup.outputs.platform }}
          ARCHITECTURE: ${{ steps.cleanup.outputs.architecture }}
        run: |
          set -euo pipefail
          [[ "$BEFORE" =~ ^[0-9]+$ ]]
          [[ "$AFTER" =~ ^[0-9]+$ ]]
          [[ "$RECLAIMED" =~ ^[0-9]+$ ]]
          [[ "$PLATFORM" == linux ]]
          [[ "$ARCHITECTURE" == x64 ]]
          test "$(stat -c %s /mnt/swapfile)" -eq 1610612736
          swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fx /mnt/swapfile
          grep -Eq '^/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab
          test ! -e /usr/share/dotnet
          test -x /home/linuxbrew/.linuxbrew/bin/brew

      - name: Remove the managed swapfile
        uses: ./
        with:
          cleanup-profile: custom
          swapfile-size: "0"

      - name: Verify swapfile removal
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /mnt/swapfile
          if swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fxq /mnt/swapfile; then
            echo "/mnt/swapfile is still active" >&2
            exit 1
          fi
          if grep -Eq '^/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab; then
            echo "/mnt/swapfile still has an fstab entry" >&2
            exit 1
          fi

  platform-smoke:
    name: ${{ matrix.name }}
    needs: static-validation
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Ubuntu arm64
            runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
          - name: Ubuntu slim
            runner: ubuntu-slim
            platform: linux
            architecture: x64
          - name: Windows x64
            runner: windows-latest
            platform: windows
            architecture: x64
          - name: Windows arm64
            runner: windows-11-arm
            platform: windows
            architecture: arm64
          - name: macOS arm64
            runner: macos-latest
            platform: macos
            architecture: arm64
          - name: macOS Intel
            runner: macos-15-intel
            platform: macos
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert Windows PostgreSQL fixture and service exist
        if: matrix.platform == 'windows' && matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $services = @(Get-Service -Name 'postgresql-*' -ErrorAction SilentlyContinue)
          if ($services.Count -eq 0) {
            throw 'Expected the Windows x64 runner image to contain a PostgreSQL service.'
          }
          if ($services.Name | Where-Object { $_ -notmatch '^postgresql-x64-\d+(?:\.\d+)*$' }) {
            throw 'PostgreSQL service name is outside the adapter allowlist.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PGROOT) -or -not (Test-Path -LiteralPath $env:PGROOT)) {
            throw 'Expected the Windows x64 runner image to contain PGROOT.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PGDATA) -or -not (Test-Path -LiteralPath $env:PGDATA)) {
            throw 'Expected the Windows x64 runner image to contain PGDATA.'
          }
          $dataRoot = Split-Path -Parent $env:PGDATA
          if ($dataRoot -notmatch '^C:\\PostgreSQL\\\d+(?:\.\d+)*$') {
            throw "Unexpected PostgreSQL data root: $dataRoot"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "POSTGRES_DATA_ROOT=$dataRoot" -Encoding utf8

      - name: Exercise Windows PostgreSQL cleanup
        if: matrix.platform == 'windows' && matrix.architecture == 'x64'
        uses: ./
        with:
          cleanup-profile: custom
          remove-postgresql: "true"

      - name: Verify Windows PostgreSQL cleanup
        if: matrix.platform == 'windows' && matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $running = @(
            Get-Service -Name 'postgresql-*' -ErrorAction SilentlyContinue |
              Where-Object Status -ne 'Stopped'
          )
          if ($running.Count -ne 0) {
            throw "PostgreSQL service is still running: $($running.Name -join ', ')"
          }
          if (Test-Path -LiteralPath $env:POSTGRES_DATA_ROOT) {
            throw "PostgreSQL data root still exists: $env:POSTGRES_DATA_ROOT"
          }
          $remainingDataRoots = @(
            Get-ChildItem -LiteralPath 'C:\PostgreSQL' -Directory -ErrorAction SilentlyContinue |
              Where-Object Name -Match '^\d+(?:\.\d+)*$'
          )
          if ($remainingDataRoots.Count -ne 0) {
            throw "Versioned PostgreSQL data roots remain: $($remainingDataRoots.FullName -join ', ')"
          }

      - name: Exercise the native adapter
        uses: ./.github/actions/platform-smoke
        with:
          expected-platform: ${{ matrix.platform }}
          expected-architecture: ${{ matrix.architecture }}
