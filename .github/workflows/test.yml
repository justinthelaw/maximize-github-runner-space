name: Test

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and unit tests
        run: npm test

      - name: Formatting
        run: npm run format:check

      - name: Verify committed action bundle
        run: npm run check-dist

  default-max:
    name: Ubuntu x64 legacy default
    needs: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Capture swap state
        shell: bash
        run: |
          set -euo pipefail
          if swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fxq /mnt/swapfile; then
            echo "SWAP_ACTIVE=1" >> "$GITHUB_ENV"
          else
            echo "SWAP_ACTIVE=0" >> "$GITHUB_ENV"
          fi
          if grep -Eq '^/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab; then
            echo "SWAP_FSTAB=1" >> "$GITHUB_ENV"
          else
            echo "SWAP_FSTAB=0" >> "$GITHUB_ENV"
          fi
          if [[ -e /mnt/swapfile ]]; then
            echo "SWAP_PRESENT=1" >> "$GITHUB_ENV"
            echo "SWAP_BYTES=$(stat -c %s /mnt/swapfile)" >> "$GITHUB_ENV"
          else
            echo "SWAP_PRESENT=0" >> "$GITHUB_ENV"
            echo "SWAP_BYTES=0" >> "$GITHUB_ENV"
          fi

      - name: Run historical no-input max profile
        id: cleanup
        uses: ./

      - name: Verify compatibility contract
        shell: bash
        env:
          BEFORE: ${{ steps.cleanup.outputs.available-bytes-before }}
          AFTER: ${{ steps.cleanup.outputs.available-bytes-after }}
          RECLAIMED: ${{ steps.cleanup.outputs.reclaimed-bytes }}
          PLATFORM: ${{ steps.cleanup.outputs.platform }}
          ARCHITECTURE: ${{ steps.cleanup.outputs.architecture }}
        run: |
          set -euo pipefail
          [[ "$BEFORE" =~ ^[0-9]+$ ]]
          [[ "$AFTER" =~ ^[0-9]+$ ]]
          [[ "$RECLAIMED" =~ ^[0-9]+$ ]]
          [[ "$PLATFORM" == linux ]]
          [[ "$ARCHITECTURE" == x64 ]]
          if [[ -e /mnt/swapfile ]]; then
            current_present=1
            current_bytes=$(stat -c %s /mnt/swapfile)
          else
            current_present=0
            current_bytes=0
          fi
          [[ "$current_present" == "$SWAP_PRESENT" ]]
          [[ "$current_bytes" == "$SWAP_BYTES" ]]
          if swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fxq /mnt/swapfile; then
            current_active=1
          else
            current_active=0
          fi
          if grep -Eq '^/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab; then
            current_fstab=1
          else
            current_fstab=0
          fi
          [[ "$current_active" == "$SWAP_ACTIVE" ]]
          [[ "$current_fstab" == "$SWAP_FSTAB" ]]
          test ! -e /usr/share/dotnet

  ubuntu-regressions:
    name: Ubuntu x64 batched regressions
    needs: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert protected and removable fixtures exist
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is not set}"
          test -d /usr/share/dotnet
          test -d "${RUNNER_TOOL_CACHE}/node"
          test -d "${RUNNER_TOOL_CACHE}/Python"
          command -v azcopy >/dev/null
          command -v firefox >/dev/null
          command -v google-chrome >/dev/null

      - name: Preserve exact custom-toggle semantics
        uses: ./
        with:
          cleanup-profile: custom
          remove-azcopy: "TRUE"

      - name: Verify non-lowercase toggle stayed disabled
        shell: bash
        run: command -v azcopy >/dev/null

      - name: Reject an invalid profile before mutation
        id: invalid-profile
        continue-on-error: true
        uses: ./
        with:
          cleanup-profile: invalid-profile

      - name: Reject an invalid skip before mutation
        id: invalid-skip
        continue-on-error: true
        uses: ./
        with:
          cleanup-profile: max
          skip-components: dotnet,not-a-component

      - name: Verify validation failures and fixtures
        shell: bash
        env:
          PROFILE_OUTCOME: ${{ steps.invalid-profile.outcome }}
          SKIP_OUTCOME: ${{ steps.invalid-skip.outcome }}
        run: |
          set -euo pipefail
          [[ "$PROFILE_OUTCOME" == failure ]]
          [[ "$SKIP_OUTCOME" == failure ]]
          test -d /usr/share/dotnet
          test -d "${RUNNER_TOOL_CACHE}/node"
          test -d "${RUNNER_TOOL_CACHE}/Python"
          command -v firefox >/dev/null
          command -v google-chrome >/dev/null

      - name: Exercise normalized max skips and toolcache precedence
        id: max-skip
        uses: ./
        with:
          cleanup-profile: " MaX "
          skip-components: " DotNet , Cached-Node , Firefox "

      - name: Verify skipped children survived and sibling cleanup ran
        shell: bash
        env:
          PLATFORM: ${{ steps.max-skip.outputs.platform }}
          ARCHITECTURE: ${{ steps.max-skip.outputs.architecture }}
        run: |
          set -euo pipefail
          [[ "$PLATFORM" == linux ]]
          [[ "$ARCHITECTURE" == x64 ]]
          test -d /usr/share/dotnet
          test -d "${RUNNER_TOOL_CACHE}/node"
          test ! -e "${RUNNER_TOOL_CACHE}/Python"
          command -v firefox >/dev/null
          ! command -v google-chrome >/dev/null 2>&1

  swapfile-transaction:
    name: Ubuntu x64 swap transaction
    needs: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resize swapfile with the historical fractional syntax
        uses: ./
        with:
          cleanup-profile: custom
          swapfile-size: 1.5GiB

      - name: Verify configured swapfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c %s /mnt/swapfile)" -eq 1610612736
          swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fx /mnt/swapfile
          grep -Eq '^/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab

      - name: Reject an unsafe oversized replacement
        id: oversized
        continue-on-error: true
        uses: ./
        with:
          cleanup-profile: custom
          swapfile-size: 100TiB

      - name: Verify oversized request rolled back
        shell: bash
        env:
          OUTCOME: ${{ steps.oversized.outcome }}
        run: |
          set -euo pipefail
          [[ "$OUTCOME" == failure ]]
          test "$(stat -c %s /mnt/swapfile)" -eq 1610612736
          swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fx /mnt/swapfile
          grep -Eq '^/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab

      - name: Remove the managed swapfile
        uses: ./
        with:
          cleanup-profile: custom
          swapfile-size: "0"

      - name: Verify swapfile removal
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /mnt/swapfile
          if swapon --show=NAME --noheadings | awk '{print $1}' | grep -Fxq /mnt/swapfile; then
            echo "/mnt/swapfile is still active" >&2
            exit 1
          fi
          if grep -Eq '^/mnt/swapfile[[:space:]]+none[[:space:]]+swap[[:space:]]' /etc/fstab; then
            echo "/mnt/swapfile still has an fstab entry" >&2
            exit 1
          fi

  platform-smoke:
    name: ${{ matrix.name }}
    needs: static-validation
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Ubuntu arm64
            runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
          - name: Ubuntu slim
            runner: ubuntu-slim
            platform: linux
            architecture: x64
          - name: Windows x64
            runner: windows-latest
            platform: windows
            architecture: x64
          - name: Windows arm64
            runner: windows-11-arm
            platform: windows
            architecture: arm64
          - name: macOS arm64
            runner: macos-latest
            platform: macos
            architecture: arm64
          - name: macOS Intel
            runner: macos-15-intel
            platform: macos
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert AzCopy fixture exists on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: command -v azcopy >/dev/null

      - name: Assert AzCopy fixture exists on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command azcopy -ErrorAction SilentlyContinue)) {
            throw 'Expected the runner image to contain AzCopy.'
          }

      - name: Run a bounded native cleanup
        id: cleanup
        uses: ./
        with:
          cleanup-profile: custom
          remove-azcopy: "true"

      - name: Verify runtime and outputs on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          BEFORE: ${{ steps.cleanup.outputs.available-bytes-before }}
          AFTER: ${{ steps.cleanup.outputs.available-bytes-after }}
          RECLAIMED: ${{ steps.cleanup.outputs.reclaimed-bytes }}
          PLATFORM: ${{ steps.cleanup.outputs.platform }}
          ARCHITECTURE: ${{ steps.cleanup.outputs.architecture }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          [[ "$BEFORE" =~ ^[0-9]+$ ]]
          [[ "$AFTER" =~ ^[0-9]+$ ]]
          [[ "$RECLAIMED" =~ ^[0-9]+$ ]]
          [[ "$PLATFORM" == "$EXPECTED_PLATFORM" ]]
          [[ "$ARCHITECTURE" == "$EXPECTED_ARCHITECTURE" ]]
          if command -v azcopy >/dev/null 2>&1 || command -v azcopy10 >/dev/null 2>&1; then
            echo "AzCopy was not removed" >&2
            exit 1
          fi

      - name: Verify runtime and outputs on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BEFORE: ${{ steps.cleanup.outputs.available-bytes-before }}
          AFTER: ${{ steps.cleanup.outputs.available-bytes-after }}
          RECLAIMED: ${{ steps.cleanup.outputs.reclaimed-bytes }}
          PLATFORM: ${{ steps.cleanup.outputs.platform }}
          ARCHITECTURE: ${{ steps.cleanup.outputs.architecture }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          if ($env:BEFORE -notmatch '^\d+$') { throw 'Invalid before output.' }
          if ($env:AFTER -notmatch '^\d+$') { throw 'Invalid after output.' }
          if ($env:RECLAIMED -notmatch '^\d+$') { throw 'Invalid reclaimed output.' }
          if ($env:PLATFORM -ne $env:EXPECTED_PLATFORM) { throw 'Platform mismatch.' }
          if ($env:ARCHITECTURE -ne $env:EXPECTED_ARCHITECTURE) { throw 'Architecture mismatch.' }
          if (Get-Command azcopy -ErrorAction SilentlyContinue) { throw 'AzCopy was not removed.' }
          if (Get-Command azcopy10 -ErrorAction SilentlyContinue) { throw 'AzCopy 10 alias was not removed.' }
