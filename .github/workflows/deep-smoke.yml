name: Deep max-profile smoke

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "43 9 * * 2"

concurrency:
  group: deep-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-max:
    name: Windows x64 max
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the default destructive profile
        id: cleanup
        uses: ./
        with:
          cleanup-profile: max

      - name: Verify outputs and preserved Windows runtimes
        shell: cmd
        env:
          BEFORE: ${{ steps.cleanup.outputs.available-bytes-before }}
          AFTER: ${{ steps.cleanup.outputs.available-bytes-after }}
          RECLAIMED: ${{ steps.cleanup.outputs.reclaimed-bytes }}
          FAILED_OPERATIONS: ${{ steps.cleanup.outputs.failed-operations }}
          PLATFORM: ${{ steps.cleanup.outputs.platform }}
          ARCHITECTURE: ${{ steps.cleanup.outputs.architecture }}
        run: |
          @echo off
          echo(%BEFORE%| %SystemRoot%\System32\findstr.exe /R "^[0-9][0-9]*$" >nul || exit /b 1
          echo(%AFTER%| %SystemRoot%\System32\findstr.exe /R "^[0-9][0-9]*$" >nul || exit /b 1
          echo(%RECLAIMED%| %SystemRoot%\System32\findstr.exe /R "^[1-9][0-9]*$" >nul || exit /b 1
          if not "%FAILED_OPERATIONS%"=="0" exit /b 1
          if not "%PLATFORM%"=="windows" exit /b 1
          if not "%ARCHITECTURE%"=="x64" exit /b 1
          %SystemRoot%\System32\cmd.exe /d /s /c "exit 0" || exit /b 1
          %SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command "if ($PSVersionTable.PSVersion.Major -ne 5) { exit 1 }" || exit /b 1

  macos-max:
    name: macOS arm64 max
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record preserved OS runtimes and selected Xcode
        shell: bash
        run: |
          set -euo pipefail
          test -x /bin/bash
          test -x /bin/sh
          test -x /usr/bin/python3
          selected_xcode="$(xcode-select --print-path)"
          test -d "$selected_xcode"
          {
            echo "DEEP_SELECTED_XCODE=$selected_xcode"
            if [[ -x /usr/bin/perl ]]; then
              echo "DEEP_PERL_PRESENT=1"
            else
              echo "DEEP_PERL_PRESENT=0"
            fi
          } >>"$GITHUB_ENV"

      - name: Run the default destructive profile
        id: cleanup
        uses: ./
        with:
          cleanup-profile: max

      - name: Verify outputs, OS runtimes, and selected Xcode
        shell: bash
        env:
          BEFORE: ${{ steps.cleanup.outputs.available-bytes-before }}
          AFTER: ${{ steps.cleanup.outputs.available-bytes-after }}
          RECLAIMED: ${{ steps.cleanup.outputs.reclaimed-bytes }}
          FAILED_OPERATIONS: ${{ steps.cleanup.outputs.failed-operations }}
          PLATFORM: ${{ steps.cleanup.outputs.platform }}
          ARCHITECTURE: ${{ steps.cleanup.outputs.architecture }}
        run: |
          set -euo pipefail
          [[ "$BEFORE" =~ ^[0-9]+$ ]]
          [[ "$AFTER" =~ ^[0-9]+$ ]]
          [[ "$RECLAIMED" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_OPERATIONS" == 0 ]]
          [[ "$PLATFORM" == macos ]]
          [[ "$ARCHITECTURE" == arm64 ]]
          [[ "$(xcode-select --print-path)" == "$DEEP_SELECTED_XCODE" ]]
          test -d "$DEEP_SELECTED_XCODE"
          /bin/bash --noprofile --norc -c 'test "$(printf %s runtime-ok)" = runtime-ok'
          /bin/sh -c 'test "$(printf %s runtime-ok)" = runtime-ok'
          /usr/bin/python3 -I -S -c 'import hashlib, json; assert len(hashlib.sha256(json.dumps({"status": "ok"}).encode()).hexdigest()) == 64'
          if [[ "$DEEP_PERL_PRESENT" == 1 ]]; then
            /usr/bin/perl -e 'exit(("runtime-ok" eq "runtime-ok") ? 0 : 1)'
          elif [[ "$DEEP_PERL_PRESENT" != 0 ]]; then
            echo "Invalid pre-cleanup Perl state: $DEEP_PERL_PRESENT" >&2
            exit 1
          fi
